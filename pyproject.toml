[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapgen"
version = "0.1.0"
description = "Offline map generation pipeline: real geography -> Web Mercator -> uniform hex grid -> game map data"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyproj>=3.6",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
